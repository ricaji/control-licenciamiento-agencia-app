<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingreso | Control Licenciamiento Agencia APP</title>
<style>
:root{--pri:#1f5eff;--ink:#1c2430;--mut:#6b7686;--line:#e2e7ee;--ok:#12805c;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#1f5eff,#0b2a7a);color:var(--ink);padding:16px}
.card{background:#fff;border-radius:14px;width:min(400px,100%);padding:28px;box-shadow:0 12px 40px #0004}
h1{margin:0 0 2px;font-size:1.25rem;text-align:center}
.sub{margin:0 0 18px;text-align:center;color:var(--mut);font-size:.88rem}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mut);margin-bottom:12px}
input{font:inherit;color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:8px;width:100%}
input:focus{outline:2px solid #1f5eff55;border-color:var(--pri)}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--pri);cursor:pointer;font-size:.8rem}
ul{list-style:none;margin:-4px 0 12px;padding:0;font-size:.8rem;color:var(--mut)}
li::before{content:"○ "}li.ok{color:var(--ok)}li.ok::before{content:"● "}
.go{width:100%;padding:11px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.lnk{display:block;margin:12px auto 0;border:0;background:none;color:var(--pri);cursor:pointer;font:inherit;font-size:.85rem}
.msg{min-height:1.2em;margin-top:10px;text-align:center;font-size:.85rem;color:var(--bad)}
.msg.ok{color:var(--ok)}
.note{background:#fff6e0;color:#7a5200;border-radius:8px;padding:10px;font-size:.82rem;margin-bottom:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Control Licenciamiento Agencia APP</h1>
  <p class="sub">Acceso con número de cédula</p>
  <div class="note" id="note" hidden>Aún no hay administrador. Crea el <b>Administrador inicial</b>; después él creará los demás usuarios.</div>
  <form id="f" autocomplete="off" novalidate>
    <label>Usuario (número de cédula)
      <input id="u" inputmode="numeric" maxlength="10" placeholder="Ej. 1012345678" autocomplete="username">
    </label>
    <label id="lMail" hidden>Correo electrónico
      <input id="mail" type="email" autocomplete="email">
    </label>
    <label id="lNom" hidden>Nombre
      <input id="nom">
    </label>
    <label id="lPw">Contraseña
      <span class="pw"><input id="p" type="password" autocomplete="current-password"><button type="button" id="eye">Ver</button></span>
    </label>
    <label id="c2" hidden>Confirmar contraseña
      <input id="p2" type="password" maxlength="8" autocomplete="new-password">
    </label>
    <ul id="rules" hidden>
      <li data-r="len">Exactamente 8 caracteres</li>
      <li data-r="up">Una mayúscula</li>
      <li data-r="lo">Una minúscula</li>
      <li data-r="nu">Un número</li>
      <li data-r="sp">Un símbolo especial (!@#$%&*…)</li>
    </ul>
    <button class="go" id="go" type="submit">Ingresar</button>
    <button class="lnk" id="olv" type="button">Olvidé mi contraseña</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script type="module">
import {Auth} from './auth.js';
const $=s=>document.querySelector(s);
const msg=(t,ok)=>{$('#msg').textContent=t;$('#msg').className='msg'+(ok?' ok':'')};
let boot=false;
try{
  if(await Auth.ready){location.replace('index.html')}
  boot=!(await Auth.initialized());
}catch(e){msg('No se pudo conectar con el servidor.')}
if(boot){
  for(const s of ['#note','#lMail','#lNom','#c2','#rules'])$(s).hidden=false;
  $('#p').autocomplete='new-password';$('#p').maxLength=8;
  $('#go').textContent='Crear administrador inicial';$('#olv').hidden=true;
}
function upd(){const p=$('#p').value;document.querySelectorAll('#rules li').forEach(li=>li.classList.toggle('ok',Auth.checks[li.dataset.r](p)))}
$('#p').oninput=upd;
$('#u').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'');
$('#eye').onclick=()=>{const t=$('#p').type==='password';$('#p').type=$('#p2').type=t?'text':'password';$('#eye').textContent=t?'Ocultar':'Ver'};
$('#olv').onclick=async()=>{
  const u=$('#u').value.trim();
  if(!Auth.ccOk(u))return msg('Escribe tu cédula (6 a 10 dígitos) y vuelve a pulsar.');
  try{await Auth.sendReset(u)}catch(e){}
  msg('Si la cédula está registrada, se envió un correo para cambiar la contraseña.',true);
};
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const u=$('#u').value.trim(),p=$('#p').value,b=$('#go');
  if(!Auth.ccOk(u))return msg('La cédula debe tener entre 6 y 10 dígitos numéricos.');
  b.disabled=true;msg('');
  try{
    if(boot){
      const mail=$('#mail').value.trim();
      if(!Auth.emailOk(mail))throw new Error('mail');
      if(!Auth.pwOk(p))throw new Error('pw');
      if(p!==$('#p2').value)throw new Error('pw2');
      await Auth.bootstrap(u,mail,$('#nom').value.trim()||'Administrador',p);
    }else{
      if(!p)throw new Error('cred');
      await Auth.login(u,p);
    }
    location.href='index.html';
  }catch(err){
    const c=err.code||'',m=err.message;
    msg(m==='mail'?'Escribe un correo válido.'
      :m==='pw'?'La contraseña no cumple los requisitos.'
      :m==='pw2'?'Las contraseñas no coinciden.'
      :m==='sinperfil'?'Tu usuario está desactivado o no tiene permisos.'
      :c==='auth/too-many-requests'?'Demasiados intentos. Espera unos minutos.'
      :c==='auth/email-already-in-use'?'Ese correo ya está en uso.'
      :c==='permission-denied'||c==='auth/network-request-failed'?'No se pudo completar la operación. Revisa la conexión.'
      :'Cédula o contraseña incorrecta.');
  }finally{b.disabled=false}
};
</script>
</body>
</html>
